name: ci
on:
  push:
    branches: [main]
    # docs alone build nothing: no run for a doc update
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
# one run per ref: a newer push cancels the older run (Actions minutes are capped)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      # Build against a tagged sock-contract. The tag lives in
      # client/.contract-ref, which make check also builds against; bump it
      # deliberately, in the change that starts using what the new tag adds.
      - id: pins
        run: |
          echo "contract=$(cat client/.contract-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: aeryx-ai/sock-contract
          ref: ${{ steps.pins.outputs.contract }}
          path: contract
          ssh-key: ${{ secrets.CONTRACT_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: make check
        working-directory: client
